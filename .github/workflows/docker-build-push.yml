name: 🐳 构建并推送Docker镜像

on:
  push:
    branches: [ main, master, v2 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: '自定义标签'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: cxsz16888/sehuatang

jobs:
  # 安全扫描和代码检查
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行Trivy漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 上传Trivy扫描结果
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # 构建和推送镜像
  build-and-push:
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: always() && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: 登录Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Sehuatang Crawler
            org.opencontainers.image.description=高效的论坛数据抓取系统
            org.opencontainers.image.vendor=Sehuatang Project
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            WITH_X1080X_BROWSER=true
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

      - name: 镜像漏洞扫描
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: 上传镜像扫描结果
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-results.sarif'

  # 部署测试
  test-deployment:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name != 'pull_request' && needs.build-and-push.result == 'success'
    env:
      TEST_IMAGE: ${{ needs.build-and-push.outputs.image-ref }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 测试镜像内浏览器
        run: |
          docker run --rm --init --network none --memory 1g --shm-size 256m \
            "$TEST_IMAGE" python scripts/check_x1080x_browser.py

      - name: 测试Docker镜像
        run: |
          # 创建测试配置
          mkdir -p test-config
          # 隔离配置，避免示例 MongoDB SRV 和通知设置触发外部请求。
          docker run --rm -v "$(pwd)/test-config:/output" "$TEST_IMAGE" python -c '
          import yaml
          config = yaml.safe_load(open("/app/config/config.example.yaml", encoding="utf-8"))
          config["mongodb"].update(enable=False, use_conn_str=False, db_host="127.0.0.1", db_port=27017)
          config["sendMessage"].update(send_telegram_enable=False, tg_bot_token="123:test")
          config["crawler"]["retry_failed"]["enabled"] = False
          for source in config["crawler"]["sources"].values():
              source["enabled"] = False
          with open("/output/config.yaml", "w", encoding="utf-8") as output:
              yaml.safe_dump(config, output, allow_unicode=True, sort_keys=False)
          '

          # 运行健康检查
          docker run --rm \
            --network none \
            -v "$(pwd)/test-config:/app/config" \
            "$TEST_IMAGE" \
            python run.py --mode health

      - name: 测试容器启动
        run: |
          # 启动真实 Web 进程；测试配置已禁用全部采集、数据库和通知。
          docker run --rm -d --init --network none --memory 1g --shm-size 256m \
            --name test-container \
            -e SHT_WEB_TOKEN=ci-smoke \
            -v "$(pwd)/test-config:/app/config" \
            "$TEST_IMAGE"
          trap 'docker logs test-container; docker stop test-container >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if docker exec test-container python -c '
          import json, urllib.request
          request = urllib.request.Request("http://127.0.0.1:8181/api/status", headers={"X-Token": "ci-smoke"})
          with urllib.request.urlopen(request, timeout=2) as response:
              status = json.load(response)
          assert len(status["sources"]) == 3
          assert not any(source["enabled"] for source in status["sources"])
          ' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Web 管理接口未在期限内就绪"
          exit 1

  # 通知
  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, test-deployment]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: 发送成功通知
        if: needs.build-and-push.result == 'success' && needs.test-deployment.result == 'success'
        run: |
          echo "✅ Docker镜像构建和测试成功完成！"
          echo "📦 镜像标签: ${{ needs.build-and-push.outputs.image-tags }}"
          echo "🔍 镜像摘要: ${{ needs.build-and-push.outputs.image-digest }}"

      - name: 发送失败通知
        if: needs.build-and-push.result == 'failure' || needs.test-deployment.result == 'failure'
        run: |
          echo "❌ Docker镜像构建或测试失败！"
          echo "请检查构建日志以获取详细信息。"

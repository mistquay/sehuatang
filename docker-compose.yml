version: '3.8'

services:
  sehuatang-crawler:
    image: cxsz16888/sehuatang:v2
    container_name: sehuatang-crawler
    restart: unless-stopped
    stop_grace_period: 45s
    init: true
    shm_size: "256mb"

    # 环境变量
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - DOCKER_CONTAINER=true
      - PYTHONPATH=/app
      # Web 管理页访问令牌（监听非本机地址时必须设置，也可写在 config 的 web.token）
      # - SHT_WEB_TOKEN=change-me

    # 挂载卷
    volumes:
      - ./config:/app/config     # 配置文件（管理页需要写入）
      - ./logs:/app/logs         # 日志文件
      - crawler_data:/app/data   # 数据目录

    # Web 管理页端口（务必配置 web.token 或 SHT_WEB_TOKEN）
    ports:
      - "8181:8181"

    # 网络配置
    networks:
      - crawler_network

    # 同一镜像内包含短时登录用的 Firefox，内存从 1G 起步，按实际负载调整。
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.1'

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 默认命令：调度器 + Web 管理页
    command: ["python", "run.py", "--mode", "web"]

  # CF 过盾服务（FlareSolverr 兼容 API；x1080x 必需，sehuatang 触发 CF 时也会用）
  # 在 config 的 crawler.sources.<source>.challenge.flaresolverr_url
  # 填 http://byparr:8191/v1
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8191:8191"
    networks:
      - crawler_network

# 网络配置
networks:
  crawler_network:
    driver: bridge
    name: sehuatang_network

# 数据卷
volumes:
  crawler_data:
    name: sehuatang_data
